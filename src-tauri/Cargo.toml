[package]
name = "deepseek-harness-tauri"
version = "0.1.0"
description = "DeepSeek Harness 桌面壳（Tauri）：启动内嵌 dsh web 服务并在原生窗口打开 Web UI"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

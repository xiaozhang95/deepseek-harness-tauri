[package]
name = "build-runtime"
version = "0.1.0"
description = "DeepSeek Harness Tauri 运行时装配工具：从主仓库物化 dsh + 下载 node.exe（独立于 tauri 主包，避免 tauri-build 资源校验死锁）"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
